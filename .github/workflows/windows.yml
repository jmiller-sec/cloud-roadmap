name: Build Windows and Mac apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 4.5.0)"
        default: "4.5.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      DESKTOP_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from tag
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V="4.5.0"
          echo "APP_VERSION=$V" >> $GITHUB_ENV
      - name: Build installer
        run: ./gradlew :desktop:packageMsi "-PappVersion=${{ env.APP_VERSION }}" --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Cloud Roadmap v${{ env.APP_VERSION }}
          make_latest: true
          files: desktop/build/compose/binaries/main/msi/*.msi
          body: "Windows: download the .msi and run it. Mac: download the .dmg (arm64 for M-series, x64 for Intel) and drag the app into Applications. Your progress syncs through this repo."

  mac:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      DESKTOP_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V="4.5.0"
          echo "APP_VERSION=$V" >> $GITHUB_ENV
      - name: Make the Mac icon
        run: |
          cd desktop
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
      - name: Build the Mac app
        run: ./gradlew :desktop:packageDmg "-PappVersion=${{ env.APP_VERSION }}" --no-daemon
      - name: Name it by chip
        run: |
          cd desktop/build/compose/binaries/main/dmg
          mv *.dmg "Cloud.Roadmap-${{ env.APP_VERSION }}-mac-${{ matrix.arch }}.dmg"
      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: desktop/build/compose/binaries/main/dmg/*.dmg
